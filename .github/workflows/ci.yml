name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The job never pushes; do not leave a credential in .git/config for
          # any later step (or a compromised dependency) to read.
          persist-credentials: false

      - name: Set up Node 22
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # No dependency needs an install script, and the package's own `prepare`
        # build runs explicitly below; `--ignore-scripts` removes an entire
        # supply-chain execution surface from CI.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # `npm run build` type-checks `src/` only and Vitest transforms without
      # type-checking, so a type error in `tests/` would otherwise merge green.
      - name: Type check
        run: npm run typecheck

      # `dist/` is gitignored, so a tarball from a clean clone contains no code.
      # The gate moves any existing `dist/` aside before `npm pack`, so it can
      # only pass when `prepack` builds the entry points. It runs before the
      # explicit build for the same reason: a stale earlier build must not be
      # able to satisfy it.
      - name: Assert the published tarball contains dist
        run: node scripts/assert-pack.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      # A green run proves nothing if a suite was deleted, silently skipped,
      # failed to collect, or left a `todo`. This enumerates every
      # tests/**/*.test.ts and requires it in the report, plus a minimum total,
      # that `numPassedTests` accounts for the whole run, and that both
      # real-renderer suites executed. Adding tests needs no gate edit.
      - name: Assert the minimum tests and real-renderer suites ran
        run: node scripts/assert-test-count.mjs vitest-report.json

      # The input boundary is YAML and JSONC parsing, so a moderate parser
      # advisory (stack overflow, DoS) is a real denial of service. Gate at
      # moderate; the lock currently reports zero advisories at every level.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

