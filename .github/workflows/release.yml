# Publish a release.
#
# The maintainer publishes the tag; this workflow does the rest. A tag is the
# only trigger, and the tag name must be `v` + the exact version in
# `package.json` (checked below), so a mistyped tag cannot publish a package
# with a different version.
#
# Required repository secret:
#   NPM_TOKEN — an npm automation token for the `farna-bootstrapper` package.
#               Set it under Settings > Secrets and variables > Actions. The
#               token needs publish rights for the package; provenance is
#               generated by npm from the workflow's OIDC identity, so no
#               additional signing secret is kept here.
#
# The GitHub Release uses the workflow's own GITHUB_TOKEN. `contents: write` is
# for the release, and `id-token: write` is what npm provenance attests. No
# other permission is granted.
#
# Release procedure:
#   1. Update the version in package.json and CHANGELOG.md in a normal PR.
#   2. Merge it to main and wait for CI to pass.
#   3. `git tag -a v<version> -m "v<version>" && git push origin v<version>`.
#   4. Watch this workflow. It publishes to npm and creates the GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Nothing in this job pushes; do not leave a credential for a later
          # step (or a compromised dependency) to read.
          persist-credentials: false

      - name: Set up Node 22 and the npm registry
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          # Writes an .npmrc whose auth token is read from NODE_AUTH_TOKEN,
          # which only the publish step is given.
          registry-url: https://registry.npmjs.org

      - name: Install
        # Same supply-chain posture as CI: no dependency needs an install
        # script, and the package's own build runs explicitly below.
        run: npm ci --ignore-scripts

      - name: Verify the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "publishing farna-bootstrapper ${version} from ${GITHUB_REF_NAME}"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Proves `prepack` builds the entry points from a tree with `dist/`
      # moved aside, and that the tarball carries no repository-only path.
      - name: Assert the published tarball contents
        run: |
          node scripts/assert-pack.mjs
          npm pack --dry-run

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Assert the minimum tests and real-renderer suites ran
        run: node scripts/assert-test-count.mjs vitest-report.json

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # Pack the exact artefact that will be published. A tarball that cannot
      # be produced from this tree must fail before `npm publish` runs.
      - name: Pack
        run: npm pack

      - name: Publish to npm
        # `publishConfig` already sets access and provenance; the flags are
        # repeated here so the published record states them explicitly. The
        # OIDC token is exchanged by npm for a provenance attestation.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --generate-notes
