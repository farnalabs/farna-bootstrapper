# Publish a release.
#
# The maintainer publishes the tag; this workflow verifies and publishes. A tag
# is the only trigger, and the tag name must be `v` + the exact version in
# `package.json` (checked below), so a mistyped tag cannot publish a package
# with a different version. The tagged commit must also be an ancestor of
# `origin/main`: a tag pushed from a side branch is refused before any publish.
#
# Two jobs, so the gates run with read-only permissions and only the publish
# job can write. `verify` checks out full history (needed for the ancestor
# check), runs the same gates as CI, and uploads the exact tarball `npm pack`
# produced. `publish` downloads that tarball and publishes those bytes; it does
# not re-pack.
#
# Required repository configuration:
#   * Environment `release` with required reviewers. `publish` names it, so the
#     job waits for an approval before the npm token is available.
#   * Environment secret `release.NPM_TOKEN` — an npm automation token for the
#     `farna-bootstrapper` package. It is an environment secret, not a
#     repository secret, so only the approved publish job can read it.
#   * npm provenance is generated from the workflow's OIDC identity, so no
#     additional signing secret is kept.
#
# The dist-tag is derived, never typed: a prerelease (`1.2.3-beta.1`) publishes
# to `next`, a stable version (`1.2.3`) to `latest`, and a version that is
# neither fails the run. Re-running a partially failed release is safe: an npm
# version that already exists is skipped, and the GitHub Release is created
# only when it is absent.
#
# Release procedure:
#   1. Update the version in package.json and CHANGELOG.md in a normal PR.
#   2. Merge it to main and wait for CI to pass.
#   3. `git tag -a v<version> -m "v<version>" && git push origin v<version>`.
#   4. Approve the `release` environment when the publish job asks.
#   5. Watch the run. It publishes the packed tarball and creates the GitHub
#      Release.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.dist_tag.outputs.version }}
      dist_tag: ${{ steps.dist_tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Full history and tags: the ancestor check needs the commit graph.
          fetch-depth: 0
          # Nothing in this job pushes; do not leave a credential in
          # .git/config for any later step (or a compromised dependency) to read.
          persist-credentials: false

      - name: Set up Node 22
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26'
          cache: npm

      - name: Install
        # Same supply-chain posture as CI: no dependency needs an install
        # script, and the package's own build runs explicitly below.
        run: npm ci --ignore-scripts

      - name: Verify the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "verifying farna-bootstrapper ${version} from ${GITHUB_REF_NAME}"

      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main --no-tags
          tagged="$(git rev-list -n 1 "${GITHUB_REF}")"
          if ! git merge-base --is-ancestor "${tagged}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${tagged}, which is not an ancestor of origin/main; release from main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} (${tagged}) is on main"

      - name: Derive the npm dist-tag
        id: dist_tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$(node -e '
            const version = require("./package.json").version;
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
            if (match === null) {
              console.error(`::error::ambiguous version "${version}": expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-PRERELEASE`);
              process.exit(1);
            }
            console.log(match[4] === undefined ? "latest" : "next");
          ')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "farna-bootstrapper ${version} publishes to the ${tag} dist-tag"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Proves `prepack` builds the entry points from a tree with `dist/` moved
      # aside, and that the tarball carries only `dist/` plus the legal files.
      - name: Assert the published tarball contents
        run: node scripts/assert-pack.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Assert the minimum tests and real-renderer suites ran
        run: node scripts/assert-test-count.mjs vitest-report.json

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # Pack the exact artefact that will be published. A tarball that cannot
      # be produced from this tree must fail before the publish job runs.
      - name: Pack
        run: npm pack

      - name: Upload the tarball
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-tarball
          path: farna-bootstrapper-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: verify
    runs-on: ubuntu-latest
    # Waits for the required reviewers configured on this environment. The npm
    # token is an environment secret, so it is unavailable until approved.
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Nothing in this job pushes; do not leave a credential for a later
          # step (or a compromised dependency) to read.
          persist-credentials: false

      - name: Set up Node 22 and the npm registry
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26'
          # Writes an .npmrc whose auth token is read from NODE_AUTH_TOKEN,
          # which only the publish step is given.
          registry-url: https://registry.npmjs.org

      - name: Download the tarball
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-tarball

      - name: Publish to npm
        # Publishes the exact bytes `npm pack` produced, never a fresh pack. A
        # version already on the registry is skipped so a re-run can finish a
        # partial release (for example after the Release step failed).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          tarball="farna-bootstrapper-${VERSION}.tgz"
          if [ ! -f "${tarball}" ]; then
            echo "::error::the packed tarball ${tarball} was not downloaded"
            exit 1
          fi
          if npm view "farna-bootstrapper@${VERSION}" version >/dev/null 2>&1; then
            echo "farna-bootstrapper@${VERSION} is already published; skipping npm publish"
          else
            npm publish "./${tarball}" --provenance --access public --tag "${DIST_TAG}"
          fi

      - name: Create the GitHub Release
        # Idempotent: a re-run after a partial failure must not fail because the
        # release exists.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
